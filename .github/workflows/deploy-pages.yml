name: Build PDFs & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Dijalankan SEBELUM build PDF: langkah ini menerbitkan `base_url`, yang
      # dipakai export_pdf.py untuk menulis anotasi tautan absolut ke PDF.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Chrome (for slide PDF export)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build slide PDFs (Reveal.js)
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 scripts/export_pdf.py mgg01.html
          python3 scripts/export_pdf.py mgg02.html
          python3 scripts/export_pdf.py mgg03.html
          python3 scripts/export_pdf.py mgg04.html
          python3 scripts/export_pdf.py mgg05.html
          python3 scripts/export_pdf.py mgg06.html

      - name: Build hands-on PDFs (Vivliostyle)
        run: |
          HANDSON_WEEK=02 npm run bake
          HANDSON_WEEK=02 npm run build:pdf
          HANDSON_WEEK=03 npm run bake
          HANDSON_WEEK=03 npm run build:pdf
          HANDSON_WEEK=04 npm run bake
          HANDSON_WEEK=04 npm run build:pdf
          HANDSON_WEEK=06 npm run bake
          HANDSON_WEEK=06 npm run build:pdf

      - name: Verify PDFs exist
        run: |
          ls -la pdf/
          test -f pdf/mgg01.pdf
          test -f pdf/mgg02.pdf
          test -f pdf/mgg03.pdf
          test -f pdf/mgg04.pdf
          test -f pdf/mgg05.pdf
          test -f pdf/mgg06.pdf
          test -f pdf/mgg02-hands-on.pdf
          test -f pdf/mgg03-hands-on.pdf
          test -f pdf/mgg04-hands-on.pdf
          test -f pdf/mgg06-hands-on.pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
